<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台登录 - 广西糖业集团</title>
    <link rel="stylesheet" href="css/admin-login.css">
</head>
<body class="login">
    <div class="login-container">
        <!-- 左侧品牌展示区 -->
        <div class="login-left">
            <div class="login-left-content">
                <div class="login-brand">
                    <img class="login-brand-logo" src="public/images/logo-standard.svg" alt="MS">
                </div>
            </div>
        </div>

        <!-- 右侧登录表单区 -->
        <div class="login-right">
            <form class="login-form" id="loginForm" action="#" method="post">
                <h2 class="login-title">登录</h2>

                <div class="login-form-item">
                    <label class="login-label" for="username">账号</label>
                    <input type="text" id="username" name="username" class="login-input" placeholder="请输入账号" autocomplete="username">
                </div>

                <div class="login-form-item">
                    <label class="login-label" for="password">密码</label>
                    <input type="password" id="password" name="password" class="login-input" placeholder="请输入密码" autocomplete="current-password">
                </div>

                <button type="submit" class="login-btn">登 录</button>

                <a href="index.html" class="login-back-link">返回官网</a>
            </form>
        </div>
    </div>

    <script src="js/admin-login.js"></script>
</body>
</html>
